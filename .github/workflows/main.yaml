name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        os:
          - macOS-latest  # arm64
          - macOS-15-intel  # x86-64
          - ubuntu-latest
          - ubuntu-24.04-arm
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

    steps:
    - uses: actions/checkout@v7

    - name: Set up conda environment (Python <=3.14)
      if: matrix.python-version != '3.15'
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: devtools/conda-envs/test.yaml
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Set up conda environment (Python 3.15)
      if: matrix.python-version == '3.15'
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: devtools/conda-envs/test_py315.yaml
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install .

    - name: Environment Information
      run: |
        micromamba info
        micromamba list

    - name: Run tests
      if: always()
      run: |
        pytest -n logical --durations=10 tests/ -r fE --color=yes
